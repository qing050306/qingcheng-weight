        dom.saveRecordButton.removeAttribute('aria-busy');
        dom.saveRecordButton.textContent = recordMode === 'edit' ? '保存修改' : '保存记录';
      }

      function openRecordSheet(mode, recordId, trigger) {
        if (!dom.recordLayer.hidden || !dom.confirmLayer.hidden) return;
        const record = mode === 'edit' ? state.records.find((item) => item.id === recordId) : null;
        if (mode === 'edit' && !record) {
          showToast('这条记录已不存在');
          return;
        }

        recordMode = mode;
        editingRecordId = record ? record.id : null;
        lastFocusedBeforeRecord = trigger || document.activeElement;
        isSavingRecord = false;
        recordCommitted = false;

        const unit = state.settings.unit;
        const todayKey = nowDateKey();
        const now = beijingParts();
        dom.recordTitle.textContent = mode === 'edit' ? '编辑记录' : '记录体重';
        dom.weightUnitSuffix.textContent = unitSuffix(unit);
        dom.weightHint.textContent = `一位小数，${formatRange(unit)}`;
        dom.weightInput.placeholder = unit === 'jin' ? '例如 130.8' : '例如 65.4';
        dom.weightInput.value = record ? formatWeightValue(record.grams, unit) : '';
        dom.dateInput.min = '1900-01-01';
        dom.dateInput.max = todayKey;
        dom.dateInput.value = record ? record.at.slice(0, 10) : now.dateKey;
        dom.timeInput.value = record ? record.at.slice(11, 16) : `${pad2(now.hour)}:${pad2(now.minute)}`;
        dom.noteInput.value = record ? record.note : '';
        dom.deleteRecordButton.hidden = mode !== 'edit';
        dom.deleteRecordButton.disabled = false;
        clearRecordErrors();
        resetSaveRecordButton();

        if (recordCloseTimer) {
          window.clearTimeout(recordCloseTimer);
          recordCloseTimer = null;
        }
        dom.recordLayer.classList.remove('is-open');
        dom.recordLayer.hidden = false;
        syncLayerState();
        dom.recordDialog.scrollTop = 0;
        window.requestAnimationFrame(() => {
          dom.recordLayer.classList.add('is-open');
          dom.weightInput.focus({ preventScroll: true });
          if (mode === 'edit') {
            try { dom.weightInput.select(); } catch (error) { /* noop */ }
          }
        });
      }

      function closeRecordSheet(options = {}) {
        if (dom.recordLayer.hidden || isSavingRecord) return;
        if (recordCloseTimer) window.clearTimeout(recordCloseTimer);
        dom.recordLayer.classList.remove('is-open');
        const delay = motionDelay(245);
        recordCloseTimer = window.setTimeout(() => {
          dom.recordLayer.hidden = true;
          recordCloseTimer = null;
          syncLayerState();
          if (options.restoreFocus !== false) restoreFocus(lastFocusedBeforeRecord);
          if (typeof options.afterClose === 'function') options.afterClose();
        }, delay);
      }

      function submitRecord(event) {
        if (event) event.preventDefault();
        if (isSavingRecord || recordCommitted) return;
        clearRecordErrors();

        const unit = state.settings.unit;
        const weightResult = parseWeightInput(dom.weightInput.value, unit);
        if (!weightResult.ok) {
          setRecordErrorState('weight', weightResult.error);
          dom.weightInput.focus();
          return;
        }

        const timeResult = parseRecordDateTime(dom.dateInput.value, dom.timeInput.value);
        if (!timeResult.ok) {
          setRecordErrorState('time', timeResult.error);
          if (timeResult.field === 'date') dom.dateInput.focus();
          else dom.timeInput.focus();
          return;
        }

        const note = dom.noteInput.value.trim();
        if (note.length > NOTE_MAX_LENGTH) {
          setRecordErrorState('form', `备注最多 ${NOTE_MAX_LENGTH} 字。`);
          dom.noteInput.focus();
          return;
        }

        const existing = recordMode === 'edit'
          ? state.records.find((item) => item.id === editingRecordId)
          : null;
        if (recordMode === 'edit' && !existing) {
          setRecordErrorState('form', '这条记录已不存在，请关闭后重试。');
          return;
        }

        const record = {
          id: existing ? existing.id : makeId(),
          grams: weightResult.grams,
          at: timeResult.at,
          note,
          createdAt: existing ? existing.createdAt : Date.now()
        };

        isSavingRecord = true;
        dom.saveRecordButton.disabled = true;
        dom.saveRecordButton.setAttribute('aria-busy', 'true');
        dom.saveRecordButton.textContent = '保存中…';

        try {
          const nextState = cloneState(state);
          if (existing) {
            nextState.records = nextState.records.map((item) => item.id === existing.id ? record : item);
          } else {
            nextState.records.push(record);
          }
          if (!commitState(nextState)) {
            throw new Error('无法写入本机存储');
          }

          const savedMode = recordMode;
          const message = savedMode === 'edit'
            ? `记录已更新 · ${formatWeightValue(record.grams, unit)} ${unitSuffix(unit)}`
            : `已记录 · ${formatWeightValue(record.grams, unit)} ${unitSuffix(unit)}`;
          renderAll();
          recordCommitted = true;
          isSavingRecord = false;
          closeRecordSheet({
            restoreFocus: false,
            afterClose: () => {
              showToast(message);
              focusElement(dom.addRecordButton);
            }
          });
        } catch (error) {
          isSavingRecord = false;
          resetSaveRecordButton();
          setRecordErrorState('form', '保存失败：本机存储不可用或已满，本次记录没有保存。');
        }
      }

      /* ============================================================
       * 首次引导：现在体重 + 目标体重 + 目标月份
       * ============================================================ */
      let onboardingSaving = false;
      let onboardingCloseTimer = null;

      function defaultOnboardingMonth() {
        const parts = beijingParts();
        const target = new Date(Date.UTC(parts.year, parts.month - 1 + 6, 1));
        return `${target.getUTCFullYear()}-${pad2(target.getUTCMonth() + 1)}`;
      }

      function syncOnboardingUnit() {
        const unit = state.settings.unit;
        dom.onbUnitToggle.querySelectorAll('[data-onb-unit]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.onbUnit === unit));
        });
        dom.onbWeightUnit.textContent = unitSuffix(unit);
        dom.onbGoalUnit.textContent = unitSuffix(unit);
        dom.onbWeightHint.textContent = `一位小数，${formatRange(unit)}`;
        dom.onbWeightInput.placeholder = unit === 'jin' ? '例如 240.0' : '例如 120.0';
        dom.onbGoalInput.placeholder = unit === 'jin' ? '例如 125.0' : '例如 62.5';
      }

      function switchOnboardingUnit(nextUnit) {
        const previousUnit = state.settings.unit;
        if (!UNITS[nextUnit] || nextUnit === previousUnit) return;
        const weightRaw = dom.onbWeightInput.value;
        const goalRaw = dom.onbGoalInput.value;
        const nextState = cloneState(state);
        nextState.settings.unit = nextUnit;
        if (!commitState(nextState)) {
          showOnboardingError('切换单位失败：本机存储不可用。', 'weight');
          return;
        }
        const convert = (input, raw) => {
          if (!String(raw).trim()) return;
          const parsed = parseWeightInput(raw, previousUnit);
          if (parsed.ok) input.value = formatWeightValue(parsed.grams, nextUnit);
        };
        convert(dom.onbWeightInput, weightRaw);
        convert(dom.onbGoalInput, goalRaw);
        syncOnboardingUnit();
        clearOnboardingError();
        updateOnboardingPreview();
        renderAll();
      }

      function clearOnboardingError() {
        dom.onbError.hidden = true;
        dom.onbError.textContent = '';
        dom.onbWeightInput.removeAttribute('aria-invalid');
        dom.onbGoalInput.removeAttribute('aria-invalid');
        dom.onbMonthInput.removeAttribute('aria-invalid');
      }

      function showOnboardingError(message, field) {
        dom.onbError.textContent = message;
        dom.onbError.hidden = false;
        if (field === 'weight') {
          dom.onbWeightInput.setAttribute('aria-invalid', 'true');
          dom.onbWeightInput.focus();
        } else if (field === 'goal') {
          dom.onbGoalInput.setAttribute('aria-invalid', 'true');
          dom.onbGoalInput.focus();
        } else if (field === 'month') {
          dom.onbMonthInput.setAttribute('aria-invalid', 'true');
          dom.onbMonthInput.focus();
        }
      }

      function updateOnboardingPreview() {
        const unit = state.settings.unit;
        const weight = parseWeightInput(dom.onbWeightInput.value, unit);
        const goal = parseWeightInput(dom.onbGoalInput.value, unit);
        const monthRaw = String(dom.onbMonthInput.value || '').trim();
        if (!weight.ok || !goal.ok || !isValidMonthKey(monthRaw) || monthRaw < currentMonthKey()) {
          dom.onbPreview.textContent = '填好三项后，这里会算出每月大概要变多少。';
          return;
        }
        const months = monthKeysBetween(currentMonthKey(), monthRaw);
        if (!months.length) {
          dom.onbPreview.textContent = '目标月份不能早于本月。';
          return;
        }
        const diff = goal.grams - weight.grams;
        if (diff === 0) {
          dom.onbPreview.innerHTML = `目标与现在相同，共 <b>${months.length}</b> 个月。`;
          return;
        }
        const perMonth = Math.round(Math.abs(diff) / months.length);
        const verb = diff < 0 ? '减' : '增';
        dom.onbPreview.innerHTML = `还要${verb} <b>${formatWeightValue(Math.abs(diff), unit)} ${unitSuffix(unit)}</b>，`
          + `共 <b>${months.length}</b> 个月，每月约${verb} <b>${formatWeightValue(perMonth, unit)} ${unitSuffix(unit)}</b>。`;
      }

      function openOnboarding() {
        if (!dom.onboardingLayer.hidden) return;
        if (onboardingCloseTimer) {
          window.clearTimeout(onboardingCloseTimer);
          onboardingCloseTimer = null;
        }
        const unit = state.settings.unit;
        const latest = getLatestRecord();
        dom.onbWeightInput.value = latest ? formatWeightValue(latest.grams, unit) : '';
        dom.onbGoalInput.value = state.settings.goalGrams === null
          ? ''
          : formatWeightValue(state.settings.goalGrams, unit);
        dom.onbMonthInput.min = currentMonthKey();
        dom.onbMonthInput.value = state.settings.goalDate
          ? monthKeyOf(state.settings.goalDate)
          : defaultOnboardingMonth();
        syncOnboardingUnit();
        clearOnboardingError();
        updateOnboardingPreview();
        onboardingSaving = false;
        dom.onbSubmitButton.disabled = false;
        dom.onbSubmitButton.textContent = '开始记录';
        dom.onboardingLayer.classList.remove('is-open');
        dom.onboardingLayer.hidden = false;
        syncLayerState();
        window.requestAnimationFrame(() => {
          dom.onboardingLayer.classList.add('is-open');
          dom.onbWeightInput.focus({ preventScroll: true });
        });
      }

      function closeOnboarding() {
        if (dom.onboardingLayer.hidden) return;
        if (onboardingCloseTimer) window.clearTimeout(onboardingCloseTimer);
        dom.onboardingLayer.classList.remove('is-open');
        const delay = motionDelay(245);
        onboardingCloseTimer = window.setTimeout(() => {
          dom.onboardingLayer.hidden = true;
          onboardingCloseTimer = null;
          syncLayerState();
        }, delay);
      }

      function submitOnboarding(event) {
        if (event) event.preventDefault();
        if (onboardingSaving) return;
        clearOnboardingError();

        const unit = state.settings.unit;
        const weight = parseWeightInput(dom.onbWeightInput.value, unit);
        if (!weight.ok) {
          showOnboardingError(`现在体重：${weight.error}`, 'weight');
          return;
        }
        const goal = parseWeightInput(dom.onbGoalInput.value, unit);
        if (!goal.ok) {
          showOnboardingError(`目标体重：${goal.error}`, 'goal');
          return;
        }
        const monthRaw = String(dom.onbMonthInput.value || '').trim();
        if (!isValidMonthKey(monthRaw)) {
          showOnboardingError('请选择目标月份。', 'month');
          return;
        }
        if (monthRaw < currentMonthKey()) {
          showOnboardingError('目标月份不能早于本月。', 'month');
          return;
        }

        onboardingSaving = true;
        dom.onbSubmitButton.disabled = true;
        dom.onbSubmitButton.textContent = '保存中…';
        try {
          const todayKey = nowDateKey();
          const nextState = cloneState(state);
          const alreadyRecorded = nextState.records.some(
            (record) => recordDateKey(record) === todayKey && record.grams === weight.grams
          );
          if (!alreadyRecorded) {
            nextState.records.push({
              id: makeId(),
              grams: weight.grams,
              at: currentBeijingISO(),
              note: '',
              createdAt: Date.now()
            });
          }
          nextState.settings = {
            ...nextState.settings,
            goalGrams: goal.grams,
            startGrams: weight.grams,
            goalDate: endOfMonthDateKey(monthRaw),
            onboarded: true
          };
          if (!commitState(nextState)) throw new Error('无法写入本机存储');
          renderAll();
          onboardingSaving = false;
          dom.onbSubmitButton.disabled = false;
          dom.onbSubmitButton.textContent = '开始记录';
          closeOnboarding();
          showToast(`目标已设定 · ${formatWeightValue(goal.grams, unit)} ${unitSuffix(unit)}`);
        } catch (error) {
          onboardingSaving = false;
          dom.onbSubmitButton.disabled = false;
          dom.onbSubmitButton.textContent = '开始记录';
          showOnboardingError('保存失败：本机存储不可用或已满。', 'weight');
        }
      }

      function skipOnboarding() {
        clearOnboardingError();
        const nextState = cloneState(state);
        nextState.settings = { ...nextState.settings, onboarded: true };
        if (!commitState(nextState)) {
          showOnboardingError('保存失败：本机存储不可用。', 'weight');
          return;
        }
        renderAll();
        closeOnboarding();
        showToast('之后可以在设置里添加目标');
      }

      /* ============================================================
       * 设置面板
       * ============================================================ */
      function clearSettingsError() {
        dom.settingsError.hidden = true;
        dom.settingsError.textContent = '';
        dom.goalInput.removeAttribute('aria-invalid');
        dom.startInput.removeAttribute('aria-invalid');
        dom.goalMonthInput.removeAttribute('aria-invalid');
      }

      function showSettingsError(message, field) {
        dom.settingsError.textContent = message;
        dom.settingsError.hidden = false;
        if (field === 'goal') {
          dom.goalInput.setAttribute('aria-invalid', 'true');
          dom.goalInput.focus();
        } else if (field === 'start') {
          dom.startInput.setAttribute('aria-invalid', 'true');
          dom.startInput.focus();
        } else if (field === 'month') {
          dom.goalMonthInput.setAttribute('aria-invalid', 'true');
          dom.goalMonthInput.focus();
        }
      }

      function setDataStatus(message, tone = '') {
        if (!message) {
          dom.dataStatus.hidden = true;
          dom.dataStatus.textContent = '';
          dom.dataStatus.removeAttribute('data-tone');
          return;
        }
        dom.dataStatus.textContent = message;
        dom.dataStatus.hidden = false;
        if (tone) dom.dataStatus.dataset.tone = tone;
        else dom.dataStatus.removeAttribute('data-tone');
      }

      function updateDataSummary() {
        const count = state.records.length;
        dom.dataSummary.textContent = count ? `本机共 ${count} 条记录` : '本机暂无记录';
        dom.clearDataButton.disabled = count === 0;
      }

      function updateStartPlaceholder() {
        const earliest = getEarliestRecord();
        dom.startInput.placeholder = earliest
          ? `自动 ${formatWeightValue(earliest.grams, settingsDraftUnit)}`
          : '自动';
      }

      function updateUnitControls() {
        dom.unitToggle.querySelectorAll('[data-unit]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.unit === settingsDraftUnit));
        });
        const suffix = unitSuffix(settingsDraftUnit);
        dom.goalUnitSuffix.textContent = suffix;
        dom.startUnitSuffix.textContent = suffix;
        updateStartPlaceholder();
      }

      function fillSettingsFieldsFromState() {
        settingsDraftUnit = state.settings.unit;
        dom.goalInput.value = state.settings.goalGrams === null
          ? ''
          : formatWeightValue(state.settings.goalGrams, settingsDraftUnit);
        dom.startInput.value = state.settings.startGrams === null
          ? ''
          : formatWeightValue(state.settings.startGrams, settingsDraftUnit);
        dom.goalMonthInput.min = currentMonthKey();
        dom.goalMonthInput.value = state.settings.goalDate
          ? monthKeyOf(state.settings.goalDate)
          : '';
        updateUnitControls();
        updateDataSummary();
        clearSettingsError();
      }

      function openSettings() {
        if (!dom.confirmLayer.hidden) return;
        if (settingsCloseTimer) {
          window.clearTimeout(settingsCloseTimer);
          settingsCloseTimer = null;
        }
        lastFocusedBeforeSettings = document.activeElement;
        settingsDraftUnit = state.settings.unit;
        fillSettingsFieldsFromState();
        setDataStatus('');
        dom.importFileInput.value = '';
        dom.importButton.disabled = false;
        dom.saveSettingsButton.disabled = false;
        dom.saveSettingsButton.textContent = '保存设置';
        dom.settingsContent.scrollTop = 0;
        dom.settingsView.classList.remove('is-open');
        dom.settingsView.hidden = false;
        syncLayerState();
        window.requestAnimationFrame(() => {
          dom.settingsView.classList.add('is-open');
          dom.settingsBackButton.focus({ preventScroll: true });
        });
      }

      function closeSettings() {
        if (dom.settingsView.hidden || !dom.confirmLayer.hidden) return;
        if (settingsCloseTimer) window.clearTimeout(settingsCloseTimer);
        dom.settingsView.classList.remove('is-open');
        const delay = motionDelay(245);
        settingsCloseTimer = window.setTimeout(() => {
          dom.settingsView.hidden = true;
          settingsCloseTimer = null;
          syncLayerState();
          restoreFocus(lastFocusedBeforeSettings || dom.settingsButton);
        }, delay);
      }

      function saveSettings() {
        if (isSavingSettings) return;
        clearSettingsError();
        const goalResult = parseOptionalWeight(dom.goalInput.value, settingsDraftUnit);
        if (!goalResult.ok) {
          showSettingsError(`目标体重：${goalResult.error}`, 'goal');
          return;
        }
        const startResult = parseOptionalWeight(dom.startInput.value, settingsDraftUnit);
        if (!startResult.ok) {
          showSettingsError(`起始体重：${startResult.error}`, 'start');
          return;
        }
        const monthRaw = String(dom.goalMonthInput.value || '').trim();
        let goalDate = null;
        if (monthRaw) {
          if (!isValidMonthKey(monthRaw)) {
            showSettingsError('目标月份格式不正确。', 'month');
            return;
          }
          if (monthRaw < currentMonthKey()) {
            showSettingsError('目标月份不能早于本月。', 'month');
            return;
          }
          if (goalResult.grams === null) {
            showSettingsError('先填写目标体重，再选目标月份。', 'goal');
            return;
          }
          goalDate = endOfMonthDateKey(monthRaw);
        }

        isSavingSettings = true;
        dom.saveSettingsButton.disabled = true;
        dom.saveSettingsButton.textContent = '保存中…';
        try {
          const nextState = cloneState(state);
          nextState.settings = {
            ...state.settings,
            unit: settingsDraftUnit,
            goalGrams: goalResult.grams,
            startGrams: startResult.grams,
            goalDate
          };
          if (!commitState(nextState)) throw new Error('无法写入本机存储');
          renderAll();
          fillSettingsFieldsFromState();
          showToast('设置已保存');
        } catch (error) {
          showSettingsError('保存失败：本机存储不可用或已满，设置没有保存。');
        } finally {
          isSavingSettings = false;
          dom.saveSettingsButton.disabled = false;
          dom.saveSettingsButton.textContent = '保存设置';
        }
      }

      function changeDisplayUnit(nextUnit) {
        if (!UNITS[nextUnit] || nextUnit === settingsDraftUnit) return;
        const previousUnit = settingsDraftUnit;
        const goalRaw = dom.goalInput.value;
        const startRaw = dom.startInput.value;

        const nextState = cloneState(state);
        nextState.settings.unit = nextUnit;
        if (!commitState(nextState)) {
          showSettingsError('切换单位失败：本机存储不可用或已满。');
          return;
        }

        const convertFieldValue = (input, raw) => {
          if (!String(raw).trim()) return;
          const parsed = parseWeightInput(raw, previousUnit);
          if (parsed.ok) input.value = formatWeightValue(parsed.grams, nextUnit);
        };
        convertFieldValue(dom.goalInput, goalRaw);
        convertFieldValue(dom.startInput, startRaw);

        settingsDraftUnit = nextUnit;
        clearSettingsError();
        updateUnitControls();
        renderAll();
        showToast(`显示单位已切换为${unitLabel(nextUnit)}`);
      }

      /* ============================================================
       * 导入 / 导出 / 清空
       * ============================================================ */
      function exportBackup() {
        const now = beijingParts();
        const payload = {
          format: BACKUP_FORMAT,
          version: SCHEMA_VERSION,
          exportedAt: currentBeijingISO(),
          data: cloneState(state)
        };
        const filename = `qingcheng-weight-backup-${now.dateKey.replace(/-/g, '')}-${pad2(now.hour)}${pad2(now.minute)}.json`;
        try {
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1600);
          showToast('JSON 备份已导出');
        } catch (error) {
          setDataStatus('导出失败：浏览器未能创建下载文件。', 'error');
          showToast('导出失败');
        }
      }

      async function handleImportFile(file) {
        if (!file || isImporting) return;
        isImporting = true;
        dom.importButton.disabled = true;
        setDataStatus('正在读取备份…');
        try {
          if (file.size > MAX_IMPORT_BYTES) throw new Error('备份文件超过 5 MB 上限。');
          const text = await file.text();
          if (dom.settingsView.hidden) return;

          let payload;
          try {
            payload = JSON.parse(text);
          } catch (error) {
            throw new Error('文件不是有效的 JSON。');
          }
          if (!payload || typeof payload !== 'object' || payload.format !== BACKUP_FORMAT) {
            throw new Error('这不是轻秤导出的备份文件。');
          }
          if (payload.version !== SCHEMA_VERSION) throw new Error('备份版本不受支持。');
          if (!payload.data) throw new Error('备份缺少数据内容。');

          let importedState;
          try {
            importedState = migrateState(payload.data);
          } catch (error) {
            throw new Error(error && error.message ? error.message : '备份数据格式不正确。');
          }
          if (dom.settingsView.hidden) return;

          setDataStatus('');
          const previousCount = state.records.length;
          const importedCount = importedState.records.length;
          openConfirm({
            returnFocus: dom.importButton,
            title: '导入并覆盖当前数据？',
            message: `当前 ${previousCount} 条记录将被替换为备份中的 ${importedCount} 条记录，显示单位和目标也会一并恢复。此操作无法撤销。`,
            acceptLabel: '导入并覆盖',
            onConfirm: () => {
              if (!commitState(importedState)) {
                return { ok: false, message: '导入失败：无法写入本机存储，原数据没有改变。' };
              }
              renderAll();
              settingsDraftUnit = state.settings.unit;
              fillSettingsFieldsFromState();
              return { ok: true };
            },
            onSuccess: () => {
              updateDataSummary();
              setDataStatus(`已导入 ${importedCount} 条记录。`, 'success');
              showToast(`已导入 ${importedCount} 条记录`);
              focusElement(dom.importButton);
            }
          });
        } catch (error) {
          const message = error && error.message ? error.message : '文件无法读取。';
          setDataStatus(`导入失败：${message}`, 'error');
          showToast('导入失败，请检查文件');
        } finally {
          isImporting = false;
          dom.importButton.disabled = false;
          dom.importFileInput.value = '';
        }
      }

      function requestClearData() {
        if (!state.records.length) {
          setDataStatus('本机还没有可清空的记录。');
          return;
        }
        const count = state.records.length;
        openConfirm({
          returnFocus: dom.clearDataButton,
          title: '清空全部体重数据？',
          message: `将删除本机全部 ${count} 条体重记录。目标体重、起始体重和显示单位设置会保留。此操作无法撤销。`,
          acceptLabel: '清空数据',
          onConfirm: () => {
            const nextState = cloneState(state);
            nextState.records = [];
            if (!commitState(nextState)) {
              return { ok: false, message: '清空失败：无法写入本机存储，原数据没有改变。' };
            }
            renderAll();
            updateDataSummary();
            updateStartPlaceholder();
            return { ok: true };
          },
          onSuccess: () => {
            updateDataSummary();
            setDataStatus('全部体重记录已清空。', 'success');
            showToast('体重记录已清空');
            focusElement(dom.importButton);
          }
        });
      }

      function requestDeleteRecord() {
        if (recordMode !== 'edit' || !editingRecordId) return;
        const record = state.records.find((item) => item.id === editingRecordId);
        if (!record) return;
        const unit = state.settings.unit;
        const weightText = `${formatWeightValue(record.grams, unit)} ${unitSuffix(unit)}`;
        openConfirm({
          returnFocus: dom.deleteRecordButton,
          title: '删除这条记录？',
          message: `${formatFullMoment(record.at)} · ${weightText}。删除后，当前体重、目标进度、趋势和统计会立即重新计算，且无法撤销。`,
          acceptLabel: '删除',
          onConfirm: () => {
            const nextState = cloneState(state);
            nextState.records = nextState.records.filter((item) => item.id !== record.id);
            if (!commitState(nextState)) {
              return { ok: false, message: '删除失败：无法写入本机存储，记录没有改变。' };
            }
            renderAll();
            return { ok: true };
          },
          onSuccess: () => {
            closeRecordSheet({
              restoreFocus: false,
              afterClose: () => {
                showToast('记录已删除');
                focusElement(dom.addRecordButton);
              }
            });
          }
        });
      }

      /* ============================================================
       * 二次确认弹层
       * ============================================================ */
      function openConfirm(config) {
        if (!dom.confirmLayer.hidden || !config) return;
        if (confirmCloseTimer) {
          window.clearTimeout(confirmCloseTimer);
          confirmCloseTimer = null;
        }
        confirmConfig = config;
        confirmBusy = false;
        lastFocusedBeforeConfirm = document.activeElement;
        confirmReturnFocus = config.returnFocus || lastFocusedBeforeConfirm;
        dom.confirmTitle.textContent = config.title || '确认操作';
        dom.confirmMessage.textContent = config.message || '';
        dom.confirmError.hidden = true;
        dom.confirmError.textContent = '';
        dom.confirmAcceptButton.textContent = config.acceptLabel || '确认';
        dom.confirmAcceptButton.disabled = false;
        dom.confirmCancelButton.disabled = false;
        dom.confirmLayer.classList.remove('is-open');
        dom.confirmLayer.hidden = false;
        syncLayerState();
        window.requestAnimationFrame(() => {
          dom.confirmLayer.classList.add('is-open');
          dom.confirmCancelButton.focus({ preventScroll: true });
        });
      }

      function closeConfirm(options = {}) {
        if (dom.confirmLayer.hidden || confirmBusy) return;
        if (confirmCloseTimer) window.clearTimeout(confirmCloseTimer);
        dom.confirmLayer.classList.remove('is-open');
        const delay = motionDelay(190);
        confirmCloseTimer = window.setTimeout(() => {
          dom.confirmLayer.hidden = true;
          confirmCloseTimer = null;
          syncLayerState();
          const focusTarget = confirmReturnFocus;
          confirmConfig = null;
          if (options.restoreFocus !== false) restoreFocus(focusTarget);
          if (typeof options.afterClose === 'function') options.afterClose();
        }, delay);
      }

      function acceptConfirm() {
        if (!confirmConfig || confirmBusy) return;
        confirmBusy = true;
        dom.confirmAcceptButton.disabled = true;
        dom.confirmCancelButton.disabled = true;
        dom.confirmError.hidden = true;

        let result;
        try {
          result = confirmConfig.onConfirm ? confirmConfig.onConfirm() : { ok: true };
        } catch (error) {
          result = { ok: false, message: '操作失败，请重试。' };
        }

        confirmBusy = false;
        if (!result || result.ok === false) {
          dom.confirmAcceptButton.disabled = false;
          dom.confirmCancelButton.disabled = false;
          dom.confirmError.textContent = (result && result.message) || '操作失败，请重试。';
          dom.confirmError.hidden = false;
          return;
        }

        const success = typeof confirmConfig.onSuccess === 'function' ? confirmConfig.onSuccess : null;
        dom.confirmAcceptButton.disabled = false;
        dom.confirmCancelButton.disabled = false;
        closeConfirm({
          restoreFocus: false,
          afterClose: success
        });
      }

      /* ============================================================
       * 事件绑定
       * ============================================================ */
      function bindEvents() {
        dom.settingsButton.addEventListener('click', openSettings);
        dom.settingsBackButton.addEventListener('click', closeSettings);
        dom.saveSettingsButton.addEventListener('click', saveSettings);
        dom.addRecordButton.addEventListener('click', () => openRecordSheet('create', null, dom.addRecordButton));

        document.addEventListener('click', (event) => {
          if (!(event.target instanceof Element)) return;
          const trigger = event.target.closest('[data-open-record]');
          if (!trigger) return;
          openRecordSheet('create', null, trigger);
        });

        dom.rangeSwitch.addEventListener('click', (event) => {
          if (!(event.target instanceof Element)) return;
          const button = event.target.closest('[data-range]');
          if (!button) return;
          const nextRange = Number(button.dataset.range);
          if (!RANGE_OPTIONS.includes(nextRange) || nextRange === trendRange) return;
          trendRange = nextRange;
          renderTrend();
        });

        dom.historyCard.addEventListener('click', (event) => {
          if (!(event.target instanceof Element)) return;
          const row = event.target.closest('button[data-record-id]');
          if (!row) return;
          openRecordSheet('edit', row.dataset.recordId, row);
        });

        dom.unitToggle.addEventListener('click', (event) => {
          if (!(event.target instanceof Element)) return;
          const button = event.target.closest('[data-unit]');
          if (!button) return;
          changeDisplayUnit(button.dataset.unit);
        });

        dom.goalInput.addEventListener('input', clearSettingsError);
        dom.startInput.addEventListener('input', clearSettingsError);
        dom.goalMonthInput.addEventListener('input', clearSettingsError);

        dom.onboardingForm.addEventListener('submit', submitOnboarding);
        dom.onbLaterButton.addEventListener('click', skipOnboarding);
        dom.onbUnitToggle.addEventListener('click', (event) => {
          if (!(event.target instanceof Element)) return;
          const button = event.target.closest('[data-onb-unit]');
          if (!button) return;
          switchOnboardingUnit(button.dataset.onbUnit);
        });
        dom.onbWeightInput.addEventListener('input', () => {
          clearOnboardingError();
          updateOnboardingPreview();
        });
        dom.onbGoalInput.addEventListener('input', () => {
          clearOnboardingError();
          updateOnboardingPreview();
        });
        dom.onbMonthInput.addEventListener('input', () => {
          clearOnboardingError();
          updateOnboardingPreview();
        });
        dom.exportButton.addEventListener('click', exportBackup);
        dom.importButton.addEventListener('click', () => dom.importFileInput.click());
        dom.importFileInput.addEventListener('change', () => {
          const file = dom.importFileInput.files && dom.importFileInput.files[0];
          if (file) handleImportFile(file);
        });
        dom.clearDataButton.addEventListener('click', requestClearData);

        dom.recordCloseButton.addEventListener('click', () => closeRecordSheet());
        dom.recordBackdrop.addEventListener('click', () => closeRecordSheet());
        dom.recordForm.addEventListener('submit', submitRecord);
        dom.deleteRecordButton.addEventListener('click', requestDeleteRecord);
        dom.weightInput.addEventListener('input', () => {
          dom.weightError.hidden = true;
          dom.weightError.textContent = '';
          dom.weightInput.removeAttribute('aria-invalid');
          dom.weightEntry.classList.remove('has-error');
          dom.formError.hidden = true;
        });
        const clearTimeError = () => {
          dom.timeError.hidden = true;
          dom.timeError.textContent = '';
          dom.dateInput.removeAttribute('aria-invalid');
          dom.timeInput.removeAttribute('aria-invalid');
          dom.formError.hidden = true;
        };
        dom.dateInput.addEventListener('input', clearTimeError);
        dom.timeInput.addEventListener('input', clearTimeError);
        dom.noteInput.addEventListener('input', () => { dom.formError.hidden = true; });

        dom.confirmCancelButton.addEventListener('click', () => closeConfirm());
        dom.confirmAcceptButton.addEventListener('click', acceptConfirm);
        dom.confirmBackdrop.addEventListener('click', () => closeConfirm());

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            if (!dom.confirmLayer.hidden) {
              event.preventDefault();
              closeConfirm();
              return;
            }
            if (!dom.recordLayer.hidden) {
              event.preventDefault();
              closeRecordSheet();
              return;
            }
            if (!dom.settingsView.hidden) {
              event.preventDefault();
              closeSettings();
              return;
            }
          }

          if (event.key !== 'Tab') return;
          const dialog = getTopLayerDialog();
          if (!dialog) return;
          const focusable = getFocusableElements(dialog);
          if (!focusable.length) {
            event.preventDefault();
            return;
          }
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          const active = document.activeElement;
          if (!dialog.contains(active)) {
            event.preventDefault();
            (event.shiftKey ? last : first).focus();
            return;
          }
          if (event.shiftKey && active === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && active === last) {
            event.preventDefault();
            first.focus();
          }
        });

        window.addEventListener('resize', () => {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => {
            if (dom.trendBody.querySelector('.chart-holder')) renderTrend();
          }, 120);
        });

        window.addEventListener('storage', (event) => {
          if (event.key !== STORAGE_KEY) return;
          if (!dom.settingsView.hidden || !dom.recordLayer.hidden || !dom.confirmLayer.hidden || !dom.onboardingLayer.hidden) return;
          if (event.newValue === null) {
            state = createDefaultState();
            renderAll();
            return;
          }
          try {
            state = migrateState(JSON.parse(event.newValue));
            renderAll();
          } catch (error) {
            showToast('另一个标签页更新了数据，但本页读取失败');
          }
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          if (nowDateKey() !== lastRenderedToday) renderAll();
          scheduleDayRefresh();
        });
      }

      function scheduleDayRefresh() {
        window.clearTimeout(dayRefreshTimer);
        const parts = beijingParts();
        const millisecondsIntoDay = ((parts.hour * 3600 + parts.minute * 60 + parts.second) * 1000) + (Date.now() % 1000);
        const wait = Math.max(1200, DAY_MS - millisecondsIntoDay + 1200);
        dayRefreshTimer = window.setTimeout(() => {
          renderAll();
          if (!dom.recordLayer.hidden) {
            dom.dateInput.max = nowDateKey();
          }
          scheduleDayRefresh();
        }, wait);
      }

      function initialize() {
        const loaded = readInitialState();
        state = loaded.state;
        bindEvents();
        renderAll();
        syncLayerState();
        scheduleDayRefresh();
        if (loaded.error) window.setTimeout(() => showToast(loaded.error, 4200), 260);
        if (!state.settings.onboarded && !loaded.error) {
          window.setTimeout(openOnboarding, 240);
        }
      }

      initialize();

      // 可选 PWA 外壳：HTTP(S) 下才挂 manifest / 图标并注册离线缓存。
      // 直接打开 file:// 时不加载附加资源，避免 CORS 噪音，也不影响单文件使用。
      if (location.protocol === 'https:' || location.protocol === 'http:') {
        if (!document.querySelector('link[rel="manifest"]')) {
          const manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          manifestLink.href = 'manifest.webmanifest';
          document.head.append(manifestLink);
        }
        if (!document.querySelector('link[rel="apple-touch-icon"]')) {
          const touchIconLink = document.createElement('link');
          touchIconLink.rel = 'apple-touch-icon';
          touchIconLink.href = 'apple-touch-icon.png';
          document.head.append(touchIconLink);
        }
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {
              // 离线外壳注册失败时，单文件应用本身仍完整可用。
            });
          }, { once: true });
        }
      }
    })();
  </script>
</body>
</html>
